server {
    listen 80;
    server_name www.goplantatree.org;
    return 301 $scheme://goplantatree.org$request_uri;
}

server {
    listen 80;
    server_name localhost goplantatree.org;

    # Sitemap → API endpoint
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/api/v1/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @backend;
    }

    # SPA Fallback (served dynamically by backend for SEO)
    location @backend {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }

    # API proxy
    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploads proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
    }
}
